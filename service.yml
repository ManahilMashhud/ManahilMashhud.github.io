apiVersion: v1
kind: Service
metadata:
  name: my-portfolio-service
  namespace: death
spec:
  type: NodePort  # Iska matlab hai ke yeh cluster ke baahir se bhi port ke zariye access ki ja sakegi
  selector:
    app: portfolio  # Yeh deployment wale pods ke sath connect ho jayegi
  ports:
    - port: 80         # Service ka apna port
      targetPort: 80     # Container ke andar ka port jahan app chal rahi hai
      nodePort: 30081    # (Optional) Baahir se access karne ke liye fixed port (30000-32767 ke darmiyan)