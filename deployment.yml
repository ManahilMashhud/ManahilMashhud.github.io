apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-portfolio-deployment
  namespace: death
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
      - name: portfolio
        image: 192.168.5.234/my-portfolio/my-portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
       